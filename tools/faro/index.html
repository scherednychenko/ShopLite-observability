<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopLite — Faro RUM demo</title>
  <!-- Vendored Grafana Faro Web SDK (offline; same as production frontends embed) -->
  <script src="faro-web-sdk.iife.js"></script>
  <style>
    :root { --ink:#1c2530; --muted:#6b7280; --line:#e5e7eb; --brand:#2EAD33; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#1c2530; background:#f7f8fa; }
    header { display:flex; align-items:center; gap:16px; padding:14px 22px; background:#fff; border-bottom:1px solid #e5e7eb; }
    .brand { font-weight:800; font-size:20px; } .brand span{ color:#2EAD33; }
    nav a { margin-right:14px; color:#374151; text-decoration:none; }
    main { max-width:980px; margin:22px auto; padding:0 18px; }
    .hero { width:100%; height:280px; border-radius:14px; display:block; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px; }
    .card .ph { height:120px; border-radius:8px; background:linear-gradient(135deg,#e8edf3,#dbe3ec); }
    .btn { background:#2EAD33; color:#fff; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
    .btn.secondary { background:#374151; }
    .notice { display:none; margin-top:12px; padding:10px 14px; background:#ecfdf3; border:1px solid #bbf7d0; border-radius:8px; }
    .promo { display:none; background:#fff7ed; border:1px solid #fed7aa; padding:12px 16px; border-radius:10px; margin:0 0 16px; }
    footer { color:#6b7280; text-align:center; padding:30px; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Shop<span>Lite</span></div>
    <nav><a href="?page=catalog">Catalog</a><a href="?page=product">Product</a><a href="?page=cart">Cart</a></nav>
  </header>

  <main>
    <!-- promo is injected after load → pushes content down → a little CLS -->
    <div class="promo" id="promo">🎉 Summer sale — free shipping over $50.</div>

    <!-- big hero is the Largest Contentful Paint element -->
    <svg class="hero" viewBox="0 0 980 280" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2EAD33"/><stop offset="1" stop-color="#1d6ee0"/></linearGradient></defs>
      <rect width="980" height="280" fill="url(#g)"/>
      <text x="40" y="150" fill="#fff" font-size="44" font-weight="800">Everything for your shop</text>
      <text x="40" y="195" fill="#eaf7ec" font-size="20">Browse → add to cart → checkout</text>
    </svg>

    <div style="margin-top:18px;display:flex;gap:10px;align-items:center">
      <button class="btn" id="add-to-cart">Add to cart</button>
      <button class="btn secondary" id="search">Search catalog</button>
      <span id="cart-count">Cart · 0</span>
    </div>
    <div class="notice" id="added">Added to your cart.</div>

    <div class="grid">
      <div class="card"><div class="ph"></div><p>Product 1</p></div>
      <div class="card"><div class="ph"></div><p>Product 2</p></div>
      <div class="card"><div class="ph"></div><p>Product 3</p></div>
      <div class="card"><div class="ph"></div><p>Product 4</p></div>
      <div class="card"><div class="ph"></div><p>Product 5</p></div>
      <div class="card"><div class="ph"></div><p>Product 6</p></div>
    </div>
  </main>

  <footer>RUM demo · click the buttons to generate INP · this is a portfolio demo, not a real store</footer>

  <script>
    // Initialise Faro — points at this same origin's /collect (the collector).
    // reportAllChanges:true streams LCP/CLS/INP as they update, so vitals show up
    // without having to close the tab (nicer for a live demo).
    try {
      const F = window.GrafanaFaroWebSdk;
      F.initializeFaro({
        url: (location.origin + '/collect'),
        app: { name: 'shoplite-storefront', version: '1.0.0', environment: 'demo' },
        instrumentations: [
          ...F.getWebInstrumentations().filter((i) => !/web-vitals/.test(i.name || '')),
          new F.WebVitalsInstrumentation({ reportAllChanges: true }),
        ],
      });
    } catch (e) { console.error('Faro init failed', e); }

    // A little Cumulative Layout Shift: reveal the promo shortly after load.
    setTimeout(() => { document.getElementById('promo').style.display = 'block'; }, 600);

    // Add-to-cart: a deliberately busy handler so INP has latency to report.
    let count = 0;
    document.getElementById('add-to-cart').addEventListener('click', () => {
      const end = performance.now() + 120;       // ~120ms of main-thread work
      while (performance.now() < end) { /* block */ }
      count++; document.getElementById('cart-count').textContent = 'Cart · ' + count;
      document.getElementById('added').style.display = 'block';
    });
    document.getElementById('search').addEventListener('click', () => {
      const end = performance.now() + 60;
      while (performance.now() < end) {}
    });
  </script>
</body>
</html>
